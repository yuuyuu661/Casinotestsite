<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Blackjack</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#020617;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{min-height:100vh;padding:20px;display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:16px;background:radial-gradient(circle at 50% 10%,#166534 0,#064e3b 42%,#020617 100%)}.panel,.table{background:rgba(15,23,42,.86);border:1px solid rgba(255,255,255,.12);border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.28)}.panel{padding:16px}.table{position:relative;min-height:calc(100vh - 40px);padding:20px;border:9px solid #7c2d12;background:radial-gradient(circle,#047857 0,#065f46 55%,#064e3b 100%);box-shadow:inset 0 0 0 5px rgba(250,204,21,.32),0 22px 58px rgba(0,0,0,.36)}h1,h2{margin:0 0 12px;color:#facc15}.meta{display:grid;gap:9px}.stat{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12)}.stat b{color:#facc15}.player-list{display:grid;gap:8px}.player-chip{padding:10px;border-radius:8px;background:rgba(30,41,59,.78);border:1px solid rgba(255,255,255,.08)}.player-chip.turn{outline:2px solid #facc15}.player-chip.me{background:rgba(30,64,175,.42)}.name{font-weight:900}.small{font-size:12px;color:#bfd2e9;line-height:1.6}.table-head{text-align:center;font-size:24px;font-weight:1000;color:#fef08a;margin-bottom:12px}.hands{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.hand{padding:14px;border-radius:12px;background:rgba(2,44,34,.7);border:1px solid rgba(255,255,255,.14);text-align:center}.hand.me{outline:3px solid #60a5fa}.hand.turn{box-shadow:0 0 22px rgba(250,204,21,.42)}.hand-title{font-weight:1000;color:#bfdbfe;margin-bottom:8px}.cards{min-height:104px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.card{width:70px;height:102px;object-fit:contain;border-radius:6px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}.total{margin-top:8px;font-weight:1000;color:#facc15}.message{text-align:center;margin:16px 0;font-size:20px;font-weight:1000;color:#fff}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:12px 18px;font-size:15px;font-weight:1000;cursor:pointer}.primary{background:#facc15;color:#111827}.action{background:#e5e7eb;color:#111827}.danger{background:#7f1d1d;color:#fff}.ghost{background:#334155;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.results{display:grid;gap:8px}.result{display:flex;justify-content:space-between;padding:9px;border-radius:8px;background:rgba(30,41,59,.78)}.win{color:#86efac}.lose,.bust{color:#fca5a5}.back{position:fixed;left:14px;top:14px;z-index:5;border:1px solid rgba(255,255,255,.2);background:rgba(15,23,42,.82);color:#fff;border-radius:999px;padding:9px 14px;font-weight:900;cursor:pointer}@media(max-width:980px){.page{grid-template-columns:1fr;padding:12px}.table{min-height:auto;padding:14px}.card{width:56px;height:82px}.panel{order:2}.table{order:1}.back{position:static;margin:10px}}
</style>
</head>
<body>
<button class="back" id="backBtn">← ロビー</button>
<main class="page">
  <aside class="panel">
    <h1>BLACK JACK</h1>
    <div class="meta">
      <div class="stat"><span>Room</span><b id="roomId">-</b></div>
      <div class="stat"><span>レート</span><b id="rate">-</b></div>
      <div class="stat"><span>フェーズ</span><b id="phase">-</b></div>
      <div class="stat"><span>残高</span><b id="balance">-</b></div>
    </div>
    <h2 style="margin-top:18px">プレイヤー</h2>
    <div class="player-list" id="players"></div>
  </aside>

  <section class="table">
    <div class="table-head">MULTI BLACKJACK</div>
    <div class="message" id="message">読み込み中...</div>
    <div class="hands" id="hands"></div>
    <div class="controls" id="controls"></div>
  </section>

  <aside class="panel">
    <h2>ルール</h2>
    <p class="small">全員がプレイヤーです。各自が21を超えない範囲で一番21に近い手を目指します。勝者が複数いる場合はポットを山分けします。</p>
    <p class="small">HITは1枚追加、STAYは勝負待ち、DOUBLEは同額を追加して1枚だけ引きます。SURRENDERは初手2枚の時だけ使え、半額が戻ります。</p>
    <h2 style="margin-top:18px">リザルト</h2>
    <div class="results" id="results"></div>
  </aside>
</main>
<script>
const API_BASE="https://api.oasis.red";
const params=new URLSearchParams(location.search);
const room=params.get("room");
const session=params.get("session");
let game=null;
let roomInfo=null;
const $=id=>document.getElementById(id);
const fmt=n=>`${Number(n||0).toLocaleString()} rrc`;
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
})[char]);
function cardSrc(card){
  if(!card)return "";
  const [suit,rank]=card.split(":");
  return `/static/poker/cards/${suit}_${rank}.png`;
}
function statusLabel(status,result){
  if(result==="win")return "勝ち";
  if(result==="lose")return "負け";
  if(result==="bust"||status==="bust")return "バースト";
  if(result==="surrender"||status==="surrender")return "サレンダー";
  if(status==="stand")return "ステイ";
  if(status==="playing")return "手番待ち";
  return "準備待ち";
}
async function fetchJson(url,options){
  const res=await fetch(url,options);
  const data=await res.json();
  if(!res.ok||data.ok===false)throw new Error(data.detail||data.error||"通信に失敗しました");
  return data;
}
async function loadMe(){
  if(!session)return;
  try{
    const me=await fetchJson(`${API_BASE}/api/casino/me?session=${session}`);
    $("balance").textContent=fmt(me.balance);
  }catch(e){$("balance").textContent="-"}
}
async function loadState(){
  if(!room||!session)return;
  try{
    roomInfo=await fetchJson(`${API_BASE}/api/casino/room-info?room_id=${room}`);
    const state=await fetchJson(`${API_BASE}/api/casino/blackjack-multi/state?room_id=${room}&session=${session}`);
    game=state.game;
    render();
  }catch(e){
    $("message").textContent=e.message;
  }
}
function render(){
  $("roomId").textContent=room;
  $("rate").textContent=fmt(game.rate);
  $("phase").textContent=game.phase;
  $("message").textContent=game.message||"";
  const me=game.players.find(p=>p.is_me);
  const current=Number.isInteger(game.current_turn)?game.players[game.current_turn]:null;
  $("players").innerHTML=game.players.map(p=>`<div class="player-chip ${p.is_me?"me":""} ${current&&current.user_id===p.user_id?"turn":""}"><div class="name">${esc(p.user_name)}${p.is_me?"（自分）":""}</div><div class="small">${p.ready?"準備OK":"未準備"} / ${statusLabel(p.status,p.result)} / BET ${fmt(p.bet)}</div></div>`).join("");
  $("hands").innerHTML=game.players.map(p=>`<div class="hand ${p.is_me?"me":""} ${current&&current.user_id===p.user_id?"turn":""}"><div class="hand-title">${esc(p.user_name)}</div><div class="cards">${(p.hand||[]).map(c=>`<img class="card" src="${cardSrc(c)}" alt="${esc(c)}">`).join("")}</div><div class="total">TOTAL ${p.total??"-"}</div><div class="small">${statusLabel(p.status,p.result)} / 払戻 ${fmt(p.payout)}</div></div>`).join("");
  $("results").innerHTML=(game.results||[]).map(r=>`<div class="result"><span>${esc(r.user_name)} / ${r.total}</span><b class="${r.result}">${r.profit>=0?"+":""}${fmt(r.profit)}</b></div>`).join("")||'<div class="small">結果はまだありません</div>';
  renderControls(me,current);
}
function renderControls(me,current){
  const isHost=roomInfo&&me&&String(roomInfo.host_user_id)===String(me.user_id);
  const canReady=me&&["waiting","finished"].includes(game.phase);
  const canStart=isHost&&["waiting","finished"].includes(game.phase)&&game.players.length>=2&&game.players.every(p=>p.ready);
  const myTurn=me&&current&&String(me.user_id)===String(current.user_id)&&game.phase==="playing";
  $("controls").innerHTML=`
    <button class="btn primary" id="readyBtn" ${canReady?"":"disabled"}>${me&&me.ready?"準備解除":"準備完了"}</button>
    <button class="btn primary" id="startBtn" ${canStart?"":"disabled"}>ゲーム開始</button>
    <button class="btn action" id="hitBtn" ${myTurn?"":"disabled"}>HIT</button>
    <button class="btn action" id="standBtn" ${myTurn?"":"disabled"}>STAY</button>
    <button class="btn action" id="doubleBtn" ${myTurn&&me.hand.length===2?"":"disabled"}>DOUBLE</button>
    <button class="btn danger" id="surrenderBtn" ${myTurn&&me.hand.length===2?"":"disabled"}>SURRENDER</button>
  `;
  $("readyBtn").onclick=()=>post("/ready",{ready:!(me&&me.ready)});
  $("startBtn").onclick=()=>post("/start",{});
  $("hitBtn").onclick=()=>post("/action",{action:"hit"});
  $("standBtn").onclick=()=>post("/action",{action:"stand"});
  $("doubleBtn").onclick=()=>post("/action",{action:"double"});
  $("surrenderBtn").onclick=()=>post("/action",{action:"surrender"});
}
async function post(path,body){
  try{
    await fetchJson(`${API_BASE}/api/casino/blackjack-multi${path}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session,room_id:room,...body})});
    await loadMe();
    await loadState();
  }catch(e){alert(e.message)}
}
$("backBtn").onclick=()=>{location.href=`/lobby?game=blackjack_multi${session?`&session=${session}`:""}`};
loadMe();loadState();setInterval(loadState,2000);setInterval(loadMe,5000);
</script>
</body>
</html>
